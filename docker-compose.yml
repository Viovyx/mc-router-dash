name: mc-router-dash
services:
  dashboard:
    build:
      context: .
      args:
        MC_ROUTER_API_URL: ${MC_ROUTER_API_URL}
        API_KEY: ${API_KEY}
    restart: unless-stopped
    depends_on:
      - router
    ports:
      - ${DASHBOARD_PORT:-8080}:8080

  router:
    image: itzg/mc-router:latest
    restart: unless-stopped
    user: root
    environment:
      - API_BINDING=:80
      - ROUTES_CONFIG=/etc/router/config.json
    env_file:
      - .env
    volumes:
      - mcrouter-config:/etc/router
    ports:
      - ${ROUTER_API_PORT:-8081}:80
      - ${ROUTER_MC_PORT:-25565}:25565

volumes:
  mcrouter-config:

<ul>
  @if (mcRouter.routes.hasValue()) {
    @for (route of mcRouter.routes.value(); track route.serverAddress) {
      <app-route-item [serverRoute]="route" />
    }
  }
  <app-card title="Add new route">
    @if (routeFormShown()) {
      <app-route-form (closed)="routeFormShown.set(false)" />
    } @else {
      <app-action-button name="Add" theme="submit" (click)="routeFormShown.set(true)" />
    }
  </app-card>
</ul>

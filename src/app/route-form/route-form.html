<form (submit)="submit($event)">
  @let serverAddress = routeForm.serverAddress();
  <label for="serverAddress">
    Server address (domain)
    <input type="text" id="serverAddress" [formField]="routeForm.serverAddress" />
    @if (serverAddress.touched() && serverAddress.invalid()) {
      <p class="error">{{ serverAddress.errors()[0].message }}</p>
    }
  </label>

  @let backend = routeForm.backend();
  <label for="backend">
    Backend (host:port)
    <input type="text" id="backend" [formField]="routeForm.backend" />
    @if (backend.touched() && backend.invalid()) {
      <p class="error">{{ backend.errors()[0].message }}</p>
    }
  </label>

  <div class="actions">
    <app-action-button name="Add" theme="submit" (click)="submit()" />
    <app-action-button name="Cancel" theme="delete" (click)="closed.emit()" />
  </div>
</form>
